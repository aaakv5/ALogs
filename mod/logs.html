<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALogs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>

<div id="auth-gate" class="auth-gate">
    <div class="auth-card">
        <div class="auth-title">ALogs</div>
        <div class="auth-subtitle">Введите пароль для доступа</div>
        <input type="password" id="auth-input" placeholder="Пароль" autocomplete="off">
        <button id="auth-btn">ВОЙТИ</button>
        <div id="auth-error" class="auth-error"></div>
    </div>
</div>

<main class="wrap" id="main-wrap" style="display:none;">

    <header class="top">
        <div>
            <div class="top-label">LIVE</div>
            <h1 class="top-title">Логи сервера</h1>
        </div>
        <span class="pill pill-green" id="status-pill">
            <span class="dot"></span> ОНЛАЙН
        </span>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Поиск по нику..." autocomplete="off">
            <button id="search-clear" class="search-clear" title="Очистить">×</button>
        </div>
        <div class="date-box">
            <select id="server-select" class="server-select"></select>
            <input type="date" id="date-input">
            <button id="date-today" class="date-btn" title="Сегодня">Сегодня</button>
        </div>
    </div>

    <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="grim">GrimAC <span class="count" id="count-grim">0</span></button>
        <button class="tab" data-tab="vulcan">Vulcan <span class="count" id="count-vulcan">0</span></button>
        <button class="tab" data-tab="matrix">Matrix <span class="count" id="count-matrix">0</span></button>
        <button class="tab" data-tab="chat">Чат <span class="count" id="count-chat">0</span></button>
        <button class="tab" data-tab="commands">Команды <span class="count" id="count-commands">0</span></button>
        <button class="tab" data-tab="votes">Вопросы дня <span class="count" id="count-votes">0</span></button>
    </nav>

    <section class="feed">
        <div class="feed-head">
            <span class="feed-head-left" id="feed-title">grim</span>
            <span class="pill pill-green small"><span class="dot"></span> LIVE</span>
        </div>
        <div class="feed-body" id="feed-body">
            <div class="feed-empty">Ожидание данных...</div>
        </div>
        <div class="feed-pagination" id="feed-pagination"></div>
    </section>

</main>

<script src="app.js?v=23"></script>
</body>
</html>
