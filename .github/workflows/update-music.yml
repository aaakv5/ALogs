name: Update music data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet yandex-music

      - name: Fetch music data
        env:
          YANDEX_MUSIC_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}
          YANDEX_MUSIC_PROXY: "http://127.0.0.1:8888"
        run: .venv/bin/python scripts/fetch_music.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add music-data.json
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update music data"
            git pull --rebase origin main
            git push
          fi
