<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор уровня острова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>
(function () {
    var v = Date.now();
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'level.css?v=' + v;
    document.head.appendChild(link);
})();
</script>
</head>
<body>

<div class="wrap">

    <div class="top">
        <div>
            <div class="top-label">ONEBLOCK · Утилиты</div>
            <div class="top-title">Калькулятор уровня острова</div>
        </div>
        <div class="pill pill-green">
            <span class="dot"></span> Online
        </div>
    </div>

    <div class="calc-grid">

        <div class="card">
            <div class="card-head">
                <div class="card-title">Параметры расчёта</div>
            </div>

            <div class="card-body">

                <div class="field">
                    <label class="field-label" for="blockSearch">Поиск блока</label>
                    <div class="search-box">
                        <input id="blockSearch" class="input" type="text" placeholder="Например: алмаз, маяк…" autocomplete="off">
                        <button type="button" id="searchClear" class="search-clear" aria-label="Очистить">×</button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">Блок</label>
                    <div id="blockList" class="block-list"></div>
                </div>

                <div class="field">
                    <label class="field-label">Выбранный блок</label>
                    <div class="selected-block" id="selectedBlock">
                        <span class="selected-name">Ничего не выбрано</span>
                        <span class="selected-value vl-badge" id="selectedValue">—</span>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="stacks">Количество стаков</label>
                    <input id="stacks" class="input" type="number" min="0" step="any" value="1">
                </div>

                <div class="field-hint">
                    Формула: <span class="mono">(стаки × 64 × ценность) / 100</span>
                </div>

            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">Результат</div>
            </div>

            <div class="card-body result-body">

                <div class="result-main">
                    <div class="result-label">Уровень острова</div>
                    <div class="result-value" id="resultLevel">0</div>
                </div>

                <div class="result-rows">
                    <div class="result-row">
                        <span>Стаки × 64</span>
                        <span class="mono" id="outBlocks">0</span>
                    </div>
                    <div class="result-row">
                        <span>× ценность блока = блоков</span>
                        <span class="mono" id="outScore">0</span>
                    </div>
                    <div class="result-row">
                        <span>÷ 100</span>
                        <span class="mono" id="outLevel">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var v = Date.now();
    var s = document.createElement('script');
    s.src = 'level.js?v=' + v;
    document.body.appendChild(s);
})();
</script>

</body>
</html>
