<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор уровня острова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

    <div class="top">
        <div>
            <div class="top-label">ONEBLOCK · Утилиты</div>
            <div class="top-title">Калькулятор уровня острова</div>
        </div>
        <div class="pill pill-green">
            <span class="dot"></span> Online
        </div>
    </div>

    <div class="calc-grid">

        <div class="card">
            <div class="card-head">
                <div class="card-title">Параметры расчёта</div>
            </div>

            <div class="card-body">

                <div class="field">
                    <label class="field-label" for="blockPreset">Тип блока</label>
                    <select id="blockPreset" class="input">
                        <option value="1">Камень / Булыжник / Земля</option>
                        <option value="2">Дерево (бревно)</option>
                        <option value="5">Угольный блок</option>
                        <option value="10">Железный блок</option>
                        <option value="20">Золотой блок</option>
                        <option value="40">Лазуритовый блок</option>
                        <option value="100">Алмазный блок</option>
                        <option value="150">Изумрудный блок</option>
                        <option value="500">Незеритовый блок</option>
                        <option value="800">Маяк</option>
                        <option value="custom">Своё значение…</option>
                    </select>
                </div>

                <div class="field">
                    <label class="field-label" for="blockValue">Ценность блока</label>
                    <input id="blockValue" class="input" type="number" min="0" step="any" value="1">
                </div>

                <div class="field">
                    <label class="field-label" for="stacks">Количество стаков</label>
                    <input id="stacks" class="input" type="number" min="0" step="any" value="1">
                </div>

                <div class="field-hint">
                    Формула: <span class="mono">(стаки × 64 × ценность) / 100</span>
                </div>

            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">Результат</div>
            </div>

            <div class="card-body result-body">

                <div class="result-main">
                    <div class="result-label">Уровень острова</div>
                    <div class="result-value" id="resultLevel">0</div>
                </div>

                <div class="result-rows">
                    <div class="result-row">
                        <span>Стаки × 64</span>
                        <span class="mono" id="outBlocks">0</span>
                    </div>
                    <div class="result-row">
                        <span>× ценность блока = blocks</span>
                        <span class="mono" id="outScore">0</span>
                    </div>
                    <div class="result-row">
                        <span>÷ 100</span>
                        <span class="mono" id="outLevel">0</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
